<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Nexo</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-app-region:drag;background:transparent}
body{border-radius:14px;background:#171b24}
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;text-align:center;background:#171b24;color:#d7dbe6;font-family:Inter,system-ui,sans-serif}
.splash-logo{border-radius:22%;filter:drop-shadow(0 10px 30px rgba(124,92,255,.45));animation:splash-bob 2.4s ease-in-out infinite}
.splash-wave{opacity:.25;animation:splash-wave 1.4s ease-in-out infinite}.splash-wave.w2{animation-delay:.25s}
.splash-dot{transform-origin:50px 50px;animation:splash-dot 1.4s ease-in-out infinite}
@keyframes splash-wave{0%,100%{opacity:.25}40%{opacity:1}}@keyframes splash-dot{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}}@keyframes splash-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.splash-status{color:#8a92a6;font-size:13px}
.splash{gap:18px}
.splash-tip{max-width:240px}
.splash-tip strong{font-size:11px;letter-spacing:.08em;color:#a78bfa}
.splash-tip p{margin:6px 0 0;font-size:13px;line-height:1.45;color:#f4f6fb}
</style>
</head>
<body>
<div class="splash">
<img class="splash-logo" src="build/icon.png" width="96" height="96" alt="" />
<div class="splash-tip"><strong>VOCÊ SABIA?</strong><p id="tip"></p></div>
<small class="splash-status" id="status">Abrindo o Nexo…</small>
</div>
<script>
const TIPS = ["Aperte ↑ na caixa de mensagem para editar a última mensagem que você mandou.", "Arraste um arquivo para o chat (ou cole com Ctrl+V) para mandar na hora.", "Shift+Enter pula uma linha sem enviar a mensagem.", "Clique com o botão direito em alguém na call para mudar o volume só dessa pessoa.", "Escreva @todos para avisar todo mundo do servidor.", "Passe o mouse numa mensagem e clique no alfinete para fixar no canal.", "Em Configurações > Voz, \"Ouvir minha voz\" mostra como os outros te escutam.", "Com fone de ouvido seus amigos não ouvem a própria voz de volta.", "O modo streamer esconde convites e nomes de usuário enquanto você transmite.", "Clique na sua foto lá embaixo para mudar o status para Não perturbe.", "Use ||spoiler|| para esconder um texto até alguém clicar.", "A busca no topo do chat procura mensagens no servidor inteiro."];
document.getElementById('tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
// O app troca o texto de baixo (procurando atualização, servidor acordando…).
window.setStatus = (t) => (document.getElementById('status').textContent = t);
</script>
</body>
</html>
